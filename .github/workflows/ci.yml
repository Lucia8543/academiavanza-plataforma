name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Estilo y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar estilo
        run: pnpm lint

      - name: Comprobar tipos
        run: pnpm typecheck

  pruebas:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar pruebas
        run: pnpm test

  esquema:
    name: Validar esquema SQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academiavanza_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Preparar dependencias del esquema
        env:
          PGPASSWORD: postgres
        run: |
          # El esquema referencia auth.users y auth.uid(), que en producción
          # los aporta Supabase. Aquí se simulan para poder validar el SQL.
          psql -h localhost -U postgres -d academiavanza_test <<'SQL'
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE TABLE IF NOT EXISTS auth.users (id UUID PRIMARY KEY);
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID
              LANGUAGE sql STABLE AS $$ SELECT NULL::UUID $$;
          SQL

      - name: Aplicar esquema
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          for f in database/schema/*.sql; do
            echo "── $f"
            psql -h localhost -U postgres -d academiavanza_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Aplicar datos iniciales
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          for f in database/seeds/*.sql; do
            echo "── $f"
            psql -h localhost -U postgres -d academiavanza_test -v ON_ERROR_STOP=1 -f "$f"
          done

  compilacion:
    name: Compilación
    runs-on: ubuntu-latest
    needs: [calidad]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-de-ejemplo
          NEXT_PUBLIC_APP_URL: https://academiavanza.es
